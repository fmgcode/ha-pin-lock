validate:
  name: Validar PIN
  description: Valida un PIN contra un candado configurado y ejecuta su acción si es correcto.
  fields:
    entry_id:
      name: ID de la entrada
      description: El entry_id del candado PIN a validar.
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text:
    pin:
      name: PIN
      description: El código introducido por el usuario.
      required: true
      example: "1234"
      selector:
        text:
